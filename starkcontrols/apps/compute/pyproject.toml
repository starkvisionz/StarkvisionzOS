[project]
name = "starkcontrols-compute"
version = "0.1.0"
description = "StarkControls compute service — XER ingestion, schedule and cost analytics."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pandas>=2.2,<2.3",
    "psycopg[binary,pool]>=3.2,<4",
    "boto3>=1.35,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.29",
    "ruff>=0.7,<0.13",
    "testcontainers[postgres]>=4.8,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running performance checks",
    "integration: requires a live Postgres (DATABASE_URL or Docker); excluded from the default CI run",
]
